<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha — Estação Literária</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="page-auth">

<div class="nebula-bg"></div>
<div class="overlay"></div>

<main>
  <div class="logo-circle">
    <img src="Biblioteca2.png" width="150px" height="100px">
  </div>
  <h1 class="title-auth">Estação Literária</h1>
  <p class="subtitle-auth">Redefinir Senha</p>

  <div class="card-login">
    <h2>Trocar Senha</h2>
    <p>Informe seu e-mail e a nova senha.</p>

    <form id="formSenha" novalidate>

      <div class="input-group">
        <input type="email" id="email" placeholder="E-mail cadastrado">
        <span id="err-email" style="color:var(--error);font-size:.75rem;display:none;">E-mail inválido.</span>
      </div>

      <div class="input-group">
        <input type="password" id="nova" placeholder="Nova Senha" maxlength="50">
        <span id="err-nova" style="color:var(--error);font-size:.75rem;display:none;">Mínimo 6 caracteres.</span>
      </div>

      <div class="input-group">
        <input type="password" id="confirmar" placeholder="Repita a Senha" maxlength="50">
        <span id="err-conf" style="color:var(--error);font-size:.75rem;display:none;">As senhas não coincidem.</span>
      </div>

      <div id="erro-servidor" style="
        background:rgba(255,113,108,.1);border:1px solid rgba(255,113,108,.3);
        color:#ff716c;border-radius:8px;padding:.7rem 1rem;
        font-size:.875rem;text-align:center;display:none;margin-bottom:.75rem;">
      </div>

      <div id="sucesso" style="
        background:rgba(0,245,212,.1);border:1px solid rgba(0,245,212,.3);
        color:#00f5d4;border-radius:8px;padding:.7rem 1rem;
        font-size:.875rem;text-align:center;display:none;margin-bottom:.75rem;">
        ✓ Senha alterada com sucesso! Redirecionando...
      </div>

      <button class="btn btn-primary" type="submit" id="btnConfirmar">Confirmar</button>
    </form>

    <div>
      <a id="linkVoltar" href="LoginUsuario.html">← Voltar ao Login</a>
    </div>
  </div>
</main>

<script src="utils.js"></script>
<script>
  // Ajusta o link de voltar conforme quem está logado
  if (localStorage.getItem('func_logado') === 'true') {
    document.getElementById('linkVoltar').href = 'LoginFuncionario.html';
  }
  const API = 'http://localhost:9999/Estacao-refatorado/php/recuperar_senha.php';

  function mostrarErro(id, vis) { document.getElementById(id).style.display = vis ? 'block' : 'none'; }
  function marcarCampo(id, inv) { document.getElementById(id).classList.toggle('campo-erro', inv); }

  document.getElementById('formSenha').addEventListener('submit', async e => {
    e.preventDefault();
    document.getElementById('erro-servidor').style.display = 'none';
    document.getElementById('sucesso').style.display = 'none';

    const email     = document.getElementById('email').value.trim();
    const nova      = document.getElementById('nova').value;
    const confirmar = document.getElementById('confirmar').value;
    let valido = true;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    marcarCampo('email', !emailOk); mostrarErro('err-email', !emailOk);
    if (!emailOk) valido = false;

    const novaOk = nova.length >= 6;
    marcarCampo('nova', !novaOk); mostrarErro('err-nova', !novaOk);
    if (!novaOk) valido = false;

    const confOk = nova === confirmar;
    marcarCampo('confirmar', !confOk); mostrarErro('err-conf', !confOk);
    if (!confOk) valido = false;

    if (!valido) return;

    const btn = document.getElementById('btnConfirmar');
    btn.disabled = true; btn.textContent = 'Salvando...';

    try {
      const resp  = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, nova_senha: nova }),
      });
      const dados = await resp.json();

      if (resp.ok) {
        document.getElementById('sucesso').style.display = 'block';
        document.getElementById('formSenha').reset();
        const destino = dados.tipo === 'funcionario' ? 'LoginFuncionario.html' : 'LoginUsuario.html';
        setTimeout(() => window.location.href = destino, 2500);
      } else {
        const el = document.getElementById('erro-servidor');
        el.textContent = dados.erro || 'Erro ao atualizar senha.';
        el.style.display = 'block';
      }
    } catch {
      const el = document.getElementById('erro-servidor');
      el.textContent = 'Não foi possível conectar ao servidor.';
      el.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Confirmar';
    }
  });
</script>
</body>
</html>
