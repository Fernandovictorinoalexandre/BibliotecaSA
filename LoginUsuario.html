<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<title>Estação Literária</title>

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body class="page-auth">

<div class="nebula-bg"></div>
<div class="overlay"></div>

<main>

  <!-- TOPO -->
  <div class="logo-circle">
    <img src="Biblioteca2.png" width="150px" height="100px">
  </div>

  <h1 class="title-auth">Estação Literária</h1>
  <p class="subtitle-auth">Portal do Explorador</p>

  <!-- CARD LOGIN -->
  <div class="card-login">

    <h2>Bem-vindo de volta</h2>
    <p>Acesse sua biblioteca</p>

    <form id="formLogin" novalidate>

      <div class="input-group">
        <input type="email" id="email" placeholder="E-mail" autocomplete="email">
        <span id="err-email" style="color:var(--error);font-size:.75rem;display:none;">Digite um e-mail válido.</span>
      </div>

      <div class="input-group">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
        <span id="err-senha" style="color:var(--error);font-size:.75rem;display:none;">Digite sua senha.</span>
      </div>

      <div id="erro-servidor" style="
        background:rgba(255,113,108,.1);border:1px solid rgba(255,113,108,.3);
        color:#ff716c;border-radius:8px;padding:.7rem 1rem;
        font-size:.875rem;text-align:center;display:none;margin-bottom:.75rem;">
      </div>
      <div id="aviso-tentativas" style="
        color:#ff9a3c;font-size:.8rem;text-align:center;
        display:none;margin-bottom:.5rem;font-weight:500;">
      </div>
      <button class="btn btn-primary" type="submit" id="btnEntrar">Entrar</button>

    </form>

    <div>
      <span>Novo por aqui?</span>
      <a href="CadastroUsuario.html">Criar Conta</a>
    </div>
    <div>
      <span>Esqueceu a senha?</span>
      <a href="RecuperarSenha.html">Recuperar acesso</a>
    </div>
    <div>
      <span>Precisa de ajuda?</span>
      <a href="Suporte2.html">Falar com suporte</a>
    </div>

  </div>

</main>

<script>
  const API = 'http://localhost:9999/Estacao-refatorado/php/login_usuario.php';

  // Se já logado, vai direto ao painel
  if (localStorage.getItem('logado') === 'true') {
    window.location.href = 'PainelUsuario.html';
  }

  function mostrarErro(id, vis) { document.getElementById(id).style.display = vis ? 'block' : 'none'; }
  function marcarCampo(id, inv) { document.getElementById(id).classList.toggle('campo-erro', inv); }
  let _countdownTimer = null;

  function limparErroServidor() {
    document.getElementById('erro-servidor').style.display = 'none';
    document.getElementById('aviso-tentativas').style.display = 'none';
    // Se havia countdown ativo, cancela e restaura o botão
    if (_countdownTimer) {
      clearInterval(_countdownTimer);
      _countdownTimer = null;
      const btn = document.getElementById('btnEntrar');
      btn.disabled    = false;
      btn.textContent = 'Entrar';
      delete btn.dataset.bloqueado;
    }
  }

  document.getElementById('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    limparErroServidor();

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    let valido  = true;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    marcarCampo('email', !emailOk); mostrarErro('err-email', !emailOk);
    if (!emailOk) valido = false;

    const senhaOk = senha.length >= 1;
    marcarCampo('senha', !senhaOk); mostrarErro('err-senha', !senhaOk);
    if (!senhaOk) valido = false;

    if (!valido) return;

    const btn = document.getElementById('btnEntrar');
    btn.disabled = true; btn.textContent = 'Entrando...';

    try {
      const resp  = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha }),
      });
      const dados = await resp.json();

      if (resp.ok) {
        // Chaves padronizadas com o restante do sistema
        localStorage.setItem('logado',            'true');
        localStorage.setItem('usuario_id',        dados.usuario.id);
        localStorage.setItem('usuario_nome',      dados.usuario.nome);
        localStorage.setItem('usuario_email',     dados.usuario.email);
        localStorage.setItem('usuario_foto',      dados.usuario.foto_perfil || '');
        localStorage.setItem('usuario_status',    dados.usuario.status || 'ativo');
        // Conta inativa → redireciona para página de Conta para reativar
        if (dados.usuario.status === 'inativo') {
          window.location.href = 'Conta.html';
        } else {
          window.location.href = 'PainelUsuario.html';
        }
      } else {
        const el = document.getElementById('erro-servidor');
        el.textContent = dados.erro || 'Erro ao fazer login.';
        el.style.display = 'block';

        const aviso = document.getElementById('aviso-tentativas');
        if (dados.bloqueado) {
          aviso.style.display = 'none';
          iniciarCountdown(dados.minutos_restantes || 1);
        } else if (dados.tentativas && dados.max) {
          aviso.textContent = 'Tentativa ' + dados.tentativas + ' de ' + dados.max + ' — após ' + dados.max + ' bloqueio de 1 minuto.';
          aviso.style.display = 'block';
        }
      }
    } catch {
      const el = document.getElementById('erro-servidor');
      el.textContent = 'Não foi possível conectar ao servidor.';
      el.style.display = 'block';
    } finally {
      if (!document.getElementById('btnEntrar').dataset.bloqueado) {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    }
  });

  document.getElementById('email').addEventListener('input', limparErroServidor);
  document.getElementById('senha').addEventListener('input', limparErroServidor);

  // ── Countdown de bloqueio ──────────────────────────────

  function iniciarCountdown(minutos) {
    const btn   = document.getElementById('btnEntrar');
    const el    = document.getElementById('erro-servidor');
    btn.dataset.bloqueado = 'true';
    let segundos = minutos * 60;
    if (_countdownTimer) clearInterval(_countdownTimer);

    function atualizar() {
      const m = Math.floor(segundos / 60);
      const s = String(segundos % 60).padStart(2, '0');
      btn.disabled  = true;
      btn.textContent = `Bloqueado — aguarde ${m}:${s}`;
      if (segundos <= 0) {
        clearInterval(_countdownTimer);
        btn.disabled   = false;
        btn.textContent = 'Entrar';
        delete btn.dataset.bloqueado;
        el.style.display = 'none';
      }
      segundos--;
    }
    atualizar();
    _countdownTimer = setInterval(atualizar, 1000);
  }
</script>

</body>
</html>
