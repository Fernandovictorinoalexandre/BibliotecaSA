<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estação Literária - Livros</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="leitor.css">
</head>
<body class="page-catalogo">

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo-area">
    <img src="Biblioteca2.png" width="60">
    <h1>BIBLIOTECA</h1>
  </div>
  <nav class="menu">
    <a href="PainelFuncionario.html">Painel Principal</a>
  </nav>
  <div class="right-area">
    <input type="text" placeholder="Pesquisar..." class="search">
    <div class="user-avatar">
      <img src="https://static.wikia.nocookie.net/hoducks/images/5/56/Kevin_Kaslana.jpg/revision/latest/thumbnail/width/360/height/360?cb=20250121140658" alt="Usuário">
    </div>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h1 class="logo">Estação Literária</h1>
  <nav>
    <a href="EmprestimoFuncionario.html" class="nav-item">
      <span class="material-symbols-outlined">grid_view</span>
      Empréstimos
    </a>
    <a href="Livros.html" class="nav-item active">
      <span class="material-symbols-outlined">auto_stories</span>
      Livros
    </a>
    <a href="Usuarios.html" class="nav-item">
      <span class="material-symbols-outlined">swap_horiz</span>
      Usuários
    </a>
  </nav>
</aside>

<!-- MAIN -->
<main class="main">

  <header class="header">
    <h2>Acervo de Livros</h2>
  </header>

  <!-- STATS -->
  <section class="grid">
    <div class="card">
      <p>Total de Livros</p>
      <h3 id="stat-total">—</h3>
    </div>
    <div class="card">
      <p>Disponíveis</p>
      <h3 id="stat-disponiveis">—</h3>
    </div>
    <div class="card">
      <p>Emprestados</p>
      <h3 id="stat-emprestados">—</h3>
    </div>
    <div class="card">
      <p>Categorias</p>
      <h3 id="stat-categorias">—</h3>
    </div>
  </section>

  <!-- TABELA -->
  <section class="table-section">

    <div class="table-header">
      <h3>Todos os Livros</h3>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="view-toggle">
          <button class="view-btn active" id="btn-list" title="Lista">☰</button>
          <button class="view-btn" id="btn-grid" title="Grade">⊞</button>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='CadastroLivro.html'">+ Cadastrar Livro</button>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filter-bar">
      <button class="filter-btn active">Todos</button>
      <button class="filter-btn">Disponíveis</button>
      <button class="filter-btn">Emprestados</button>
      <button class="filter-btn">Ficção Científica</button>
      <button class="filter-btn">Romance</button>
      <button class="filter-btn">Terror</button>
      <input type="text" class="filter-search" placeholder="🔍  Buscar livro ou autor...">
    </div>

    <!-- TABELA LISTA -->
    <div class="table-container" id="view-list">
      <table>
        <thead>
          <tr>
            <th>Livro</th>
            <th>Autor</th>
            <th>Categoria</th>
            <th>Ano</th>
            <th>Exemplares</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela">
          <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--on-surface-variant);">Carregando...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- GRADE VIEW -->
    <div class="books-grid" id="view-grid">
      <div id="grid-loading" style="text-align:center;padding:2rem;color:var(--on-surface-variant);">Carregando...</div>

    </div>

  </section>

</main>

<script>
  const API = 'http://localhost:9999/Estacao-refatorado/php/livros.php';
  let todosLivros  = [];
  let filtroStatus = 'todos';
  let filtroCategoria = '';

  if (!localStorage.getItem('logado')) window.location.href = 'LoginUsuario.html';

  // ── Utilitários ─────────────────────────────────────
  function fmt(iso) {
    if (!iso) return '—';
    return iso.split('-')[0]; // só o ano
  }
  function statusBadge(s) {
    const map = { disponivel: 'disponivel', emprestado: 'emprestado', indisponivel: 'indisponivel' };
    const label = { disponivel: 'Disponível', emprestado: 'Emprestado', indisponivel: 'Indisponível' };
    return `<span class="status ${map[s] || ''} pulse">${label[s] || s}</span>`;
  }

  // ── Renderizar lista ─────────────────────────────────
  function renderLista(lista) {
    const tb = document.getElementById('corpoTabela');
    if (!lista.length) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--on-surface-variant);">Nenhum livro encontrado.</td></tr>';
      return;
    }
    tb.innerHTML = lista.map(l => `
      <tr style="cursor:pointer;" onclick="verLivro(${l.id})">
        <td>
          <div class="book-cell">
            <div class="book-cover">${l.capa ? `<img src="${l.capa}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" onerror="this.parentElement.textContent='📖'">` : '📖'}</div>
            <div>
              <div class="book-title">${l.titulo}</div>
              <div class="book-isbn">ISBN: ${l.isbn || '—'}</div>
            </div>
          </div>
        </td>
        <td>${l.autor}</td>
        <td><span class="cat-badge">${l.categoria || 'Geral'}</span></td>
        <td>${fmt(l.data_publicacao)}</td>
        <td>${l.quantidade ?? '—'}</td>
        <td>${statusBadge(l.status)}</td>
      </tr>`).join('');
  }

  // ── Renderizar grade ─────────────────────────────────
  function renderGrade(lista) {
    const grid = document.getElementById('view-grid');
    if (!lista.length) {
      grid.innerHTML = '<p style="text-align:center;padding:2rem;color:var(--on-surface-variant);">Nenhum livro encontrado.</p>';
      return;
    }
    grid.innerHTML = lista.map(l => `
      <div class="book-card" onclick="verLivro(${l.id})" style="cursor:pointer;">
        <div class="book-cover-lg">${l.capa
          ? `<img src="${l.capa}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.parentElement.textContent='📖'">`
          : '📖'}</div>
        <h4>${l.titulo}</h4>
        <p class="author">${l.autor}</p>
        <div class="footer">
          <span class="cat-badge" style="font-size:.7rem;">${l.categoria || 'Geral'}</span>
          ${statusBadge(l.status)}
        </div>
      </div>`).join('');
  }

  // ── Aplicar filtros ──────────────────────────────────
  function aplicarFiltros() {
    const busca = document.querySelector('.filter-search').value.toLowerCase();
    let lista = todosLivros;

    if (filtroStatus === 'disponiveis')  lista = lista.filter(l => l.status === 'disponivel');
    if (filtroStatus === 'emprestados')  lista = lista.filter(l => l.status === 'emprestado');
    if (filtroCategoria) lista = lista.filter(l => (l.categoria || '').toLowerCase().includes(filtroCategoria));
    if (busca) lista = lista.filter(l =>
      l.titulo.toLowerCase().includes(busca) || l.autor.toLowerCase().includes(busca)
    );

    renderLista(lista);
    renderGrade(lista);
  }

  // ── Carregar livros ──────────────────────────────────
  async function carregarLivros() {
    try {
      const resp = await fetch(API);
      todosLivros = await resp.json();

      // Stats
      document.getElementById('stat-total').textContent       = todosLivros.length;
      document.getElementById('stat-disponiveis').textContent = todosLivros.filter(l => l.status === 'disponivel').length;
      document.getElementById('stat-emprestados').textContent = todosLivros.filter(l => l.status === 'emprestado').length;
      const cats = new Set(todosLivros.map(l => l.categoria || 'Geral'));
      document.getElementById('stat-categorias').textContent  = cats.size;

      aplicarFiltros();
    } catch {
      document.getElementById('corpoTabela').innerHTML =
        '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#ff716c;">Erro ao carregar dados.</td></tr>';
    }
  }

  // ── Navegar para detalhe ─────────────────────────────
  function verLivro(id) {
    const livro = todosLivros.find(l => l.id == id);
    if (livro) localStorage.setItem('livro', JSON.stringify(livro));
    window.location.href = 'LivroDetalhe.html';
  }

  // ── Filtros de status ────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const txt = btn.textContent.trim().toLowerCase();
      if (txt === 'todos')          { filtroStatus = 'todos'; filtroCategoria = ''; }
      else if (txt === 'disponíveis') filtroStatus = 'disponiveis';
      else if (txt === 'emprestados') filtroStatus = 'emprestados';
      else { filtroStatus = 'todos'; filtroCategoria = txt; }
      aplicarFiltros();
    });
  });

  // ── Busca por texto ──────────────────────────────────
  document.querySelector('.filter-search').addEventListener('input', () => aplicarFiltros());

  // ── View toggle: lista vs grade ──────────────────────
  const btnList  = document.getElementById('btn-list');
  const btnGrid  = document.getElementById('btn-grid');
  const viewList = document.getElementById('view-list');
  const viewGrid = document.getElementById('view-grid');

  btnList.addEventListener('click', () => {
    btnList.classList.add('active'); btnGrid.classList.remove('active');
    viewList.classList.remove('hidden'); viewGrid.classList.remove('visible');
  });
  btnGrid.addEventListener('click', () => {
    btnGrid.classList.add('active'); btnList.classList.remove('active');
    viewList.classList.add('hidden'); viewGrid.classList.add('visible');
  });

  carregarLivros();
</script>

</body>
</html>
