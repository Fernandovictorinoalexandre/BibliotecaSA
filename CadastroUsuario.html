<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estação Literária - Cadastro de Usuário</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="page-auth">
  <div class="nebula-bg"></div>
  <div class="overlay"></div>

  <main>
    <div>
      <div class="logo-circle">
        <img src="Biblioteca2.png" width="150px" height="100px">
      </div>

      <div class="card">
        <h1 class="title-auth">Estação Literária</h1>
        <h2>Criar Conta</h2>

        <form id="formUsuario" novalidate>

          <div class="input-group">
            <label>Nome completo
              <input type="text" id="nome" name="nome" autocomplete="name" maxlength="100">
            </label>
            <span class="msg-campo" id="err-nome">Nome obrigatório.</span>
          </div>

          <div class="input-group">
            <label>Data de Nascimento
              <input type="date" id="data_nasc" name="data_nasc"
                min="1900-01-01" max="2099-12-31"
                onkeydown="limitarAno(event, this)"
                oninput="limitarAno(event, this)">
            </label>
            <span class="msg-campo" id="err-data_nasc">Data inválida.</span>
          </div>

          <div class="input-group">
            <label>CPF
              <input type="text" id="cpf" name="cpf" maxlength="14"
                placeholder="000.000.000-00" autocomplete="off"
                oninput="mascaraCPF(this)">
            </label>
            <span class="msg-campo" id="err-cpf">CPF inválido.</span>
          </div>

          <div class="input-group">
            <label>Telefone
              <input type="text" id="telefone" name="telefone" maxlength="15"
                placeholder="(00) 00000-0000" autocomplete="tel"
                oninput="mascaraTelefone(this)">
            </label>
            <span class="msg-campo" id="err-telefone">Telefone inválido.</span>
          </div>

          <div class="input-group">
            <label>E-Mail
              <input type="email" id="email" name="email" autocomplete="email">
            </label>
            <span class="msg-campo" id="err-email">E-mail inválido.</span>
          </div>

          <div class="input-group">
            <label>Senha
              <input type="password" id="senha" name="senha" maxlength="50">
            </label>
            <span class="msg-campo" id="err-senha">Mínimo 6 caracteres.</span>
          </div>

          <div class="input-group">
            <label>Confirmar Senha
              <input type="password" id="confirmar" name="confirmar" maxlength="50">
            </label>
            <span class="msg-campo" id="err-confirmar">As senhas não coincidem.</span>
          </div>

          <button type="submit" class="btn-primary" id="btnCadastrar">Cadastrar</button>

        </form>

        <div class="footer">
          <span>Já tem uma conta?</span>
          <a href="LoginUsuario.html">Entrar</a>
        </div>
      </div><!-- /card -->
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const API = 'http://localhost:9999/Estacao-refatorado/php/usuarios.php';

    // ── Toast ────────────────────────────────────────────
    function toast(msg, tipo = 'sucesso') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast ${tipo} show`;
      setTimeout(() => el.classList.remove('show'), 3500);
    }

    // ── Máscara CPF ──────────────────────────────────────
    function mascaraCPF(el) {
      let v = el.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9)      v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      el.value = v;
    }

    // ── Máscara Telefone ─────────────────────────────────
    function mascaraTelefone(el) {
      let v = el.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 10)     v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/(\d{2})(\d{4,5})(\d{0,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
      else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
      el.value = v;
    }

    // ── Limite de 4 dígitos no ano ───────────────────────
    function limitarAno(event, el) {
      // Bloqueia digitação de 5º dígito no campo de ano
      const val = el.value;
      if (val) {
        const partes = val.split('-');
        if (partes[0] && partes[0].length > 4) {
          partes[0] = partes[0].slice(0, 4);
          el.value = partes.join('-');
        }
      }
    }

    // ── Validação CPF (algoritmo oficial) ────────────────
    function validarCPF(cpf) {
      cpf = cpf.replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
      let s = 0;
      for (let i = 0; i < 9; i++) s += parseInt(cpf[i]) * (10 - i);
      let r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
      if (r !== parseInt(cpf[9])) return false;
      s = 0;
      for (let i = 0; i < 10; i++) s += parseInt(cpf[i]) * (11 - i);
      r = (s * 10) % 11; if (r === 10 || r === 11) r = 0;
      return r === parseInt(cpf[10]);
    }

    // ── Validação inline ─────────────────────────────────
    function mostrarErro(id, visivel) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('visivel', visivel);
    }
    function marcarCampo(inputId, invalido) {
      const el = document.getElementById(inputId);
      if (el) el.classList.toggle('campo-erro', invalido);
    }

    // ── Submit ───────────────────────────────────────────
    document.getElementById('formUsuario').addEventListener('submit', async e => {
      e.preventDefault();

      const nome      = document.getElementById('nome').value.trim();
      const email     = document.getElementById('email').value.trim();
      const senha     = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar').value;
      const data_nasc = document.getElementById('data_nasc').value;
      const cpf       = document.getElementById('cpf').value.trim();
      const telefone  = document.getElementById('telefone').value.trim();

      // Validação local
      let valido = true;

      const nomeOk = nome.length >= 2;
      marcarCampo('nome', !nomeOk); mostrarErro('err-nome', !nomeOk);
      if (!nomeOk) valido = false;

      // Validar ano com 4 dígitos na data
      let dataNascOk = true;
      if (data_nasc) {
        const ano = parseInt(data_nasc.split('-')[0]);
        if (isNaN(ano) || ano < 1900 || ano > new Date().getFullYear()) dataNascOk = false;
      }
      marcarCampo('data_nasc', !dataNascOk); mostrarErro('err-data_nasc', !dataNascOk);
      if (!dataNascOk) valido = false;

      const cpfOk = !cpf || validarCPF(cpf);
      marcarCampo('cpf', !cpfOk); mostrarErro('err-cpf', !cpfOk);
      if (!cpfOk) valido = false;

      const telDigitos = telefone.replace(/\D/g, '');
      const telOk = !telefone || (telDigitos.length >= 10 && telDigitos.length <= 11);
      marcarCampo('telefone', !telOk); mostrarErro('err-telefone', !telOk);
      if (!telOk) valido = false;

      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      marcarCampo('email', !emailOk); mostrarErro('err-email', !emailOk);
      if (!emailOk) valido = false;

      const senhaOk = senha.length >= 6;
      marcarCampo('senha', !senhaOk); mostrarErro('err-senha', !senhaOk);
      if (!senhaOk) valido = false;

      const confirmOk = senha === confirmar;
      marcarCampo('confirmar', !confirmOk); mostrarErro('err-confirmar', !confirmOk);
      if (!confirmOk) valido = false;

      if (!valido) return;

      // Envio para API
      const btn = document.getElementById('btnCadastrar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Cadastrando...';

      try {
        const resp = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, data_nasc: data_nasc || null, cpf: cpf || null, telefone: telefone || null }),
        });
        const dados = await resp.json();

        if (resp.ok) {
          toast('Usuário cadastrado com sucesso!', 'sucesso');
          document.getElementById('formUsuario').reset();
          setTimeout(() => window.location.href = 'LoginUsuario.html', 2000);
        } else {
          toast(dados.erro || 'Erro ao cadastrar.', 'erro');
        }
      } catch {
        toast('Erro de conexão com o servidor.', 'erro');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Cadastrar';
      }
    });
  </script>
</body>
</html>
